group 'com.sameetdmr.zebra_printer'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.sameetdmr.zebra_printer'
    // Link-OS SDK 2.17.5585 is tested on Android 15, 16 and 17 (API 35-37)
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    lint {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependencies {
        // Zebra Link-OS Multiplatform SDK for Android (ZSDK_ANDROID_API.jar, build 2.17.5585)
        implementation fileTree(dir: 'libs', include: ['*.jar'])
        // Runtime dependencies required by the Zebra SDK (JSON settings / file operations)
        implementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
        implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
        implementation 'org.apache.commons:commons-lang3:3.14.0'
    }
}
