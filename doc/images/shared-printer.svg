<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="400" rx="16" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1f2937">One printer, many devices</text>
  <text x="40" y="82" font-size="16" fill="#4b5563">Each device holds the Bluetooth link only while it prints. Devices that find the printer busy wait and retry at random intervals.</text>

  <!-- axis -->
  <line x1="200" y1="330" x2="1150" y2="330" stroke="#d1d5db" stroke-width="2"/>
  <text x="1150" y="356" font-size="13" fill="#9ca3af" text-anchor="end">time →</text>

  <g font-size="16" font-weight="600" fill="#374151">
    <text x="40" y="140">Device A</text>
    <text x="40" y="190">Device B</text>
    <text x="40" y="250">Device C</text>
    <text x="40" y="316" fill="#065f46">Printer</text>
  </g>

  <!-- A: prints first -->
  <rect x="210" y="118" width="250" height="32" rx="8" fill="#10b981"/>
  <text x="335" y="140" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">print</text>

  <!-- B: waits then prints -->
  <line x1="260" y1="184" x2="470" y2="184" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="260" cy="184" r="7" fill="#f59e0b"/>
  <circle cx="340" cy="184" r="7" fill="#f59e0b"/>
  <rect x="472" y="168" width="260" height="32" rx="8" fill="#3b82f6"/>
  <text x="602" y="190" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">print</text>

  <!-- C: waits longer then prints -->
  <line x1="300" y1="244" x2="742" y2="244" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="300" cy="244" r="7" fill="#f59e0b"/>
  <circle cx="420" cy="244" r="7" fill="#f59e0b"/>
  <circle cx="600" cy="244" r="7" fill="#f59e0b"/>
  <rect x="744" y="228" width="240" height="32" rx="8" fill="#8b5cf6"/>
  <text x="864" y="250" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">print</text>

  <!-- printer row -->
  <rect x="210" y="298" width="250" height="24" rx="6" fill="#10b981"/>
  <rect x="472" y="298" width="260" height="24" rx="6" fill="#3b82f6"/>
  <rect x="744" y="298" width="240" height="24" rx="6" fill="#8b5cf6"/>
  <text x="1000" y="316" font-size="14" fill="#6b7280">free</text>

  <!-- legend -->
  <g font-size="14" fill="#4b5563">
    <circle cx="210" cy="378" r="7" fill="#f59e0b"/>
    <text x="224" y="383">connection attempt while busy (PrintState.waiting)</text>
    <line x1="600" y1="378" x2="640" y2="378" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="650" y="383">back-off + jitter</text>
    <rect x="800" y="368" width="36" height="20" rx="5" fill="#10b981"/>
    <text x="846" y="383">link held</text>
  </g>
</svg>
