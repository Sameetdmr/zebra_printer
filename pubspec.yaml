name: zebra_printer
description: Bluetooth for Flutter (scan, pair, connect) plus Zebra label printing with the official Link-OS SDK, built for printers shared by many devices.
version: 0.6.1
homepage: https://github.com/Sameetdmr/zebra_printer
repository: https://github.com/Sameetdmr/zebra_printer
issue_tracker: https://github.com/Sameetdmr/zebra_printer/issues
documentation: https://github.com/Sameetdmr/zebra_printer/blob/main/README.md

environment:
  sdk: ^3.7.2
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.sameetdmr.zebra_printer
        pluginClass: ZebraPrinterPlugin

screenshots:
  - description: How a print works - connect, check, send and release the printer
    path: doc/images/print-flow.png
  - description: One printer shared by many devices that take turns
    path: doc/images/shared-printer.png

topics:
  - zebra
  - printer
  - bluetooth
  - zpl
  - label-printing
