name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze, Format & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: "stable"
          cache: true

      - name: Install dependencies (package)
        working-directory: .
        run: flutter pub get

      - name: Check formatting
        working-directory: .
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze package
        working-directory: .
        run: flutter analyze

      - name: Run unit tests
        working-directory: .
        run: flutter test

      - name: Install dependencies (example)
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze

  android-build:
    name: Build Android (compiles native plugin code)
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: "stable"
          cache: true

      - name: Build example debug APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug
